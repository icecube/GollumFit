[pytest]
# Pytest configuration for GollumFit unit tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = .

# Minimum Python version
minversion = 6.0

# Add markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance benchmarks
    requires_data: marks tests that require external data files

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes
    
# Coverage options (if pytest-cov is installed)
# addopts = --cov=GollumFitPy --cov-report=html --cov-report=term

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Logging
log_cli = false
log_cli_level = INFO
log_file = test_output.log
log_file_level = DEBUG

# Test collection
norecursedirs = .git .tox dist build *.egg __pycache__
