[build-system]
requires = [
  "setuptools>=61",
  "setuptools-scm>=7",
  "wheel",
  "pybind11>=2.10",
  "numpy",
]
build-backend = "setuptools.build_meta"

[project]
name = "GollumFitPy"
dynamic = ["version"]
description = "Python bindings for GollumFit (pybind11 extension)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]

[tool.setuptools]
packages = []

[tool.setuptools_scm]
root = ".."